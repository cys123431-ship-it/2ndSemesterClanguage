name: Temporary C Code Verification

on:
  push:
    paths:
      - .github/workflows/temp-code-check.yml

jobs:
  compile-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: GCC compile all six separate programs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/clanguage-test
          gcc -std=c11 -Wall -Wextra -Werror 01_ScoreArray/main.c -o /tmp/clanguage-test/score-original
          gcc -std=c11 -Wall -Wextra -Werror 02_TheaterReservation/main.c -o /tmp/clanguage-test/theater-original
          gcc -std=c11 -Wall -Wextra -Werror 03_ArraySearch/main.c 03_ArraySearch/function.c -o /tmp/clanguage-test/array-original
          gcc -std=c11 -Wall -Wextra -Werror Applied_8to11/01_ScoreArray/main.c -o /tmp/clanguage-test/score-applied
          gcc -std=c11 -Wall -Wextra -Werror Applied_8to11/02_TheaterReservation/main.c -o /tmp/clanguage-test/theater-applied
          gcc -std=c11 -Wall -Wextra -Werror Applied_8to11/03_ArraySearch/main.c Applied_8to11/03_ArraySearch/function.c -o /tmp/clanguage-test/array-applied

      - name: Smoke test original examples
        shell: bash
        run: |
          set -euo pipefail
          printf '85\n90\n73\n100\n88\n' | /tmp/clanguage-test/score-original > /tmp/score-original.txt
          grep -q "scores\[4\] = 88" /tmp/score-original.txt
          printf 'y\n2\n3\n7\nn\n' | /tmp/clanguage-test/theater-original > /tmp/theater-original.txt
          grep -q "7번 좌석 예약 완료" /tmp/theater-original.txt
          printf '101\n' | /tmp/clanguage-test/array-original > /tmp/array-original.txt
          grep -q "배열에 없습니다" /tmp/array-original.txt

      - name: Smoke test applied examples
        shell: bash
        run: |
          set -euo pipefail
          printf '85\n90\n73\n100\n88\n' | /tmp/clanguage-test/score-applied > /tmp/score-applied.txt
          grep -q "점수 합계: 436" /tmp/score-applied.txt
          grep -q "점수 평균: 87.2" /tmp/score-applied.txt
          grep -q "최고 점수: 100" /tmp/score-applied.txt
          printf '120\n85\n90\n73\n100\n88\n' | /tmp/clanguage-test/score-applied > /tmp/score-invalid.txt
          grep -q "점수는 0부터 100까지" /tmp/score-invalid.txt
          printf 'y\n2\n3\n3\n7\nn\n' | /tmp/clanguage-test/theater-applied > /tmp/theater-applied.txt
          grep -q "이미 예약된 자리입니다" /tmp/theater-applied.txt
          grep -q "7번 좌석 예약 완료" /tmp/theater-applied.txt
          printf '101\n' | /tmp/clanguage-test/array-applied > /tmp/array-applied.txt
          grep -q "순차 탐색: 찾지 못했습니다" /tmp/array-applied.txt
          grep -q "이진 탐색: 찾지 못했습니다" /tmp/array-applied.txt

      - name: Verify full source is embedded in explanation markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          original = ["01_ScoreArray", "02_TheaterReservation", "03_ArraySearch"]
          applied = [f"Applied_8to11/{x}" for x in original]
          for folder in original + applied:
              explanation = Path(folder) / "EXPLANATION.md"
              text = explanation.read_text(encoding="utf-8")
              sources = sorted(Path(folder).glob("*.c")) + sorted(Path(folder).glob("*.h"))
              for source in sources:
                  code = source.read_text(encoding="utf-8").rstrip()
                  assert code in text, f"{source} not reproduced accurately in {explanation}"
              print(f"PASSED {explanation}")
          PY
